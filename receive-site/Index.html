<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --brand: #8f2a1b; --bg: #f5f6f8; --line: #d0d5dd; --text: #1d2939; --muted: #667085; --ok: #067647; --okbg: #dcfae6; --bad: #b42318; --badbg: #fde2e1; --warn: #b54708; --warnbg: #fef0c7; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); font-size: 17px; line-height: 1.5; }
  header { background: var(--brand); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  header nav button { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.6); border-radius: 999px; padding: 6px 16px; font-size: 16px; cursor: pointer; }
  header nav button.on { background: #fff; color: var(--brand); font-weight: 700; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 16px; cursor: pointer; color: inherit; }
  .chip.on { border-color: var(--brand); color: var(--brand); font-weight: 700; }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .btn { font: inherit; border: 0; border-radius: 12px; padding: 10px 18px; background: var(--brand); color: #fff; cursor: pointer; font-weight: 700; }
  .btn.ghost { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); }
  .btn.small { padding: 6px 12px; font-size: 15px; }
  .btn:disabled { opacity: .5; }
  .muted { color: var(--muted); } .small { font-size: 14px; }
  .msg { padding: 10px 14px; border-radius: 10px; margin: 8px 0; }
  .msg.ok { background: var(--okbg); color: var(--ok); } .msg.error { background: var(--badbg); color: var(--bad); } .msg.warn { background: var(--warnbg); color: var(--warn); } .msg.info { background: #eef4ff; color: #1849a9; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .card b { font-size: 19px; }
  .card.done { border-color: #47cd89; background: #f6fef9; } .card.issue { border-color: #f97066; background: #fff6f5; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: 14px; font-weight: 700; }
  .badge.ok { background: var(--okbg); color: var(--ok); } .badge.bad { background: var(--badbg); color: var(--bad); } .badge.none { background: #f2f4f7; color: var(--muted); }
  .grp { margin: 16px 0 6px; font-weight: 700; color: var(--brand); border-bottom: 2px solid var(--brand); padding-bottom: 4px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 10px 6px; border-bottom: 1px solid #eaecf0; }
  .item .nm { font-size: 18px; font-weight: 600; } .item .ex { font-size: 18px; font-weight: 700; white-space: nowrap; }
  .item .acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .st { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 16px; cursor: pointer; color: inherit; min-width: 64px; }
  .st.on[data-s="到齊"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .st.on[data-s="少送"], .st.on[data-s="多送"] { background: var(--warn); border-color: var(--warn); color: #fff; }
  .st.on[data-s="沒送"], .st.on[data-s="送錯"] { background: var(--bad); border-color: var(--bad); color: #fff; }
  .item.ok { background: #f6fef9; } .item.bad { background: #fff6f5; }
  .item input.got { width: 120px; } .item input.note { flex: 1; min-width: 160px; }
  .bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 -16px -16px; border-radius: 0 0 14px 14px; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .thumbs img { height: 90px; border-radius: 8px; border: 1px solid var(--line); }
  .hidden { display: none !important; }
  table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eaecf0; vertical-align: top; }
  .slipt input { width: 100%; min-width: 56px; padding: 6px; font: inherit; font-size: 16px; }
  .slipt td.w1 { width: 72px; } .slipt td.w2 { width: 90px; }
  .slipt .sn { font-size: 13px; }
  .badge.warn { background: var(--warnbg); color: var(--warn); }
  .slipwrap { overflow-x: auto; }
  @media (max-width: 600px) { body { font-size: 16px; } .card b { font-size: 17px; } }
</style>
</head>
<body>
<header>
  <h1>進貨驗收</h1>
  <nav class="row"><button type="button" data-v="vCheck" class="on">驗收</button><button type="button" data-v="vIssues">問題追蹤 <span id="issueCount"></span></button><button type="button" data-v="vMonth">月結對帳</button></nav>
</header>
<main>
  <!-- 選週、選一張叫貨單 -->
  <section id="vCheck">
    <div class="panel">
      <div class="row">
        <button type="button" class="chip" data-w="-1">上週</button><button type="button" class="chip" data-w="0">本週</button><button type="button" class="chip" data-w="1">下週</button>
        <input id="weekDate" type="date" aria-label="哪一週">
        <span id="weekText" class="muted"></span>
      </div>
      <div class="muted small" style="margin-top:6px">列出這週「確定叫貨」的 ③ 叫貨單，一張一張點：菜商、肉商、海鮮照班級點，其他廠商點品項總量。</div>
    </div>
    <div id="doneMsg"></div>
    <div id="listMsg"></div>
    <div id="cards" class="cards"></div>
  </section>

  <!-- 點一張 -->
  <section id="vDo" class="hidden">
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div><b id="doTitle" style="font-size:20px"></b><div id="doSub" class="muted small"></div></div>
        <button type="button" class="btn ghost small" id="doBack">← 回列表</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button type="button" class="btn small" id="allOk">✓ 全部到齊</button>
        <span class="muted small" id="allOkHint">先按全部到齊，再改有問題的那幾項。</span>
      </div>
      <div class="row" style="margin-top:10px">
        <input id="doQ" type="search" placeholder="🔍 搜尋食材、班級、老師" style="flex:1;min-width:180px">
        <select id="doCls" style="width:auto"></select>
        <span id="doCount" class="muted small"></span>
      </div>
      <div id="draftMsg"></div>
      <div id="doList"></div>
      <div style="margin-top:14px">
        <div class="row">
          <label class="btn ghost small" for="photoIn" style="cursor:pointer">📷 拍銷貨單</label>
          <input id="photoIn" type="file" accept="image/*" capture="environment" multiple class="hidden">
          <select id="photoRot" style="width:auto" title="照片拍成橫的，自動讀不出來時選"><option value="0">照片不轉</option><option value="90">向右轉 90°</option><option value="270">向左轉 90°</option><option value="180">轉 180°</option></select>
          <span id="photoMsg" class="muted small">可以拍好幾張，照片存在雲端硬碟。字要是正的才讀得準（拍歪了先選轉向再拍）。</span>
        </div>
        <div id="thumbs" class="thumbs"></div>
        <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line)">
          <div class="row"><b>💰 銷貨單金額</b>
            <button type="button" class="btn small" id="slipRead">🔎 自動讀銷貨單</button>
            <button type="button" class="btn ghost small" id="slipManual">手動填</button>
            <span id="slipMsg" class="muted small">選填。存起來的單價會進「單價表」，之後算成本用。</span></div>
          <div id="slipBox"></div>
        </div>
        <textarea id="doNote" rows="2" style="width:100%;margin-top:8px" placeholder="備註（選填），例如：司機說洋蔥明天補"></textarea>
      </div>
      <div id="doMsg"></div>
      <div class="bar"><span id="doProgress" class="muted"></span><span style="flex:1"></span><button type="button" class="btn" id="doSave">完成驗收</button></div>
    </div>
  </section>

  <!-- 問題追蹤 -->
  <section id="vIssues" class="hidden">
    <div class="panel">
      <div class="row"><button type="button" class="chip on" data-all="0">還沒處理的</button><button type="button" class="chip" data-all="1">最近 60 天全部</button></div>
      <div class="muted small" style="margin-top:6px">驗收時標成少送、沒送、送錯、多送的都會列在這裡。按「複製給廠商」貼到 LINE 或照著打電話，處理完記下結果（已補送、扣款、不用補）。</div>
    </div>
    <div id="issueMsg"></div>
    <div id="issueList"></div>
  </section>

  <!-- 月結對帳 -->
  <section id="vMonth" class="hidden">
    <div class="panel">
      <div class="row">
        <select id="monVendor" style="width:auto"><option value="">選廠商</option></select>
        <input id="monYm" type="month" style="width:auto">
        <button type="button" class="btn small" id="monGo">產生</button>
      </div>
      <div class="muted small" style="margin-top:6px">把這家廠商這個月每一次送貨的金額加起來，跟發票（或對帳單）比。驗收時有填銷貨單金額的用填的；沒填的用「實到數量 × 單價表的價格」估算（標「估」）；還沒驗收的照叫貨量估。</div>
    </div>
    <div id="monMsg"></div>
    <div id="monBox"></div>
  </section>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function msg(id, type, text) { $(id).innerHTML = text ? '<div class="msg ' + type + '">' + esc(text) + '</div>' : ''; }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error(String(e && e.message || e).replace(/^(Error|Exception):\s*/, '')));
      })[fn].apply(null, args);
    });
  }
  var iso = function (d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
  var md = function (s) { var p = String(s).split('-'); return Number(p[1]) + '/' + Number(p[2]); };
  var WD = ['日', '一', '二', '三', '四', '五', '六'];
  var mdw = function (s) { var p = String(s).split('-'); return md(s) + '（' + WD[new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay()] + '）'; };
  function mondayOf(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7); }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (ok, no) {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? ok() : no(); } catch (e) { no(e); } document.body.removeChild(ta);
    });
  }

  // ---------------- 分頁 ----------------
  function show(v) {
    ['vCheck', 'vDo', 'vIssues', 'vMonth'].forEach(function (x) { $(x).classList.toggle('hidden', x !== v); });
    Array.prototype.forEach.call(document.querySelectorAll('header nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === (v === 'vDo' ? 'vCheck' : v)); });
    window.scrollTo(0, 0);
  }
  document.querySelector('header nav').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (!b) return;
    var v = b.getAttribute('data-v');
    if (v === 'vIssues') { show('vIssues'); loadIssues(); } else if (v === 'vMonth') { show('vMonth'); openMonth(); } else { show('vCheck'); loadWeek(); }
  });

  // ---------------- 這週的叫貨單 ----------------
  var week = null;
  function setWeek(offset) {
    var m = mondayOf(new Date());
    m.setDate(m.getDate() + 7 * offset);
    $('weekDate').value = iso(m);
    Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function (b) { b.classList.toggle('on', Number(b.getAttribute('data-w')) === offset); });
    loadWeek();
  }
  document.querySelector('#vCheck .row').addEventListener('click', function (e) {
    var b = e.target.closest('[data-w]');
    if (b) setWeek(Number(b.getAttribute('data-w')));
  });
  $('weekDate').addEventListener('change', function () {
    Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function (b) { b.classList.remove('on'); });
    loadWeek();
  });
  function loadWeek() {
    var d = $('weekDate').value;
    if (!d) return;
    var p = d.split('-'), mon = iso(mondayOf(new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]))));
    msg('listMsg', 'info', '載入中…');
    $('cards').innerHTML = '';
    return call('getWeek', mon).then(function (w) {
      week = w;
      $('weekText').textContent = mdw(w.from) + '～' + mdw(w.to);
      msg('listMsg', w.drafts.length ? 'warn' : '', w.drafts.length ? w.drafts.join('、') + ' 還是草稿、還沒「確定叫貨」，確定後才會出現在這裡。' : '');
      if (!w.batches.length) { msg('listMsg', 'info', '這週還沒有確定叫貨的叫貨單。' + (w.drafts.length ? '（' + w.drafts.join('、') + ' 還是草稿）' : '')); return; }
      $('cards').innerHTML = w.batches.map(function (b, i) {
        var c = b.check, n = b.lines.length;
        var st = !c ? '<span class="badge none">還沒驗收</span>' : c.issues ? '<span class="badge bad">⚠ ' + c.issues + ' 項問題</span>' : '<span class="badge ok">✓ 已驗收</span>';
        return '<button type="button" class="card' + (c ? (c.issues ? ' issue' : ' done') : '') + '" data-b="' + i + '"><b>' + esc(b.vendor) + '</b>' +
          (b.group ? '<div class="muted">送貨組別 ' + esc(b.group) + '（星期' + esc(b.group.split('').join('、')) + '）</div>' : '<div class="muted">' + (!b.perClass && b.lines.some(function (x) { return x.cls; }) ? '整週合併・分送中餐／烘焙教室' : '整週合併') + '</div>') +
          '<div style="margin-top:6px">' + st + ' <span class="muted small">' + n + ' 項' + (b.perClass ? '・照班級點' : '・點總量') + (c ? '・' + esc(c.time) : '') + '</span></div></button>';
      }).join('');
    }).catch(function (e) { msg('listMsg', 'error', '載入失敗：' + e.message); });
  }
  $('cards').addEventListener('click', function (e) {
    var b = e.target.closest('[data-b]');
    if (b) openBatch(week.batches[Number(b.getAttribute('data-b'))]);
  });

  // ---------------- 點一張叫貨單 ----------------
  var cur = null;   // { b, marks: { key: { status, got, note } }, photos: [url] }
  function openBatch(b) {
    msg('doneMsg', '', '');
    var marks = {};
    if (b.check) b.check.lines.forEach(function (l) {
      var x = b.lines.filter(function (y) { return y.cls === l.cls && y.name === l.name; })[0];
      if (x) marks[x.key] = { status: l.status, got: l.status === '到齊' ? '' : l.got, note: l.note };
    });
    cur = { b: b, marks: marks, photos: b.check ? b.check.photos.slice() : [] };
    cur.slip = b.check && b.check.slip ? slipFromSaved(b.check.slip) : null;
    var d = readDraft(b);
    if (d) {
      cur.marks = d.marks; cur.photos = d.photos; if (d.slip) cur.slip = d.slip;
      $('draftMsg').innerHTML = '<div class="msg info">已恢復 ' + esc(d.at) + ' 點到一半的內容（' + Object.keys(d.marks).length + ' 項），點完按「完成驗收」才會存。 <button type="button" class="btn ghost small" id="draftDrop">清掉、重新點</button></div>';
    } else msg('draftMsg', '', '');
    $('doQ').value = '';
    var cl = [];
    b.lines.forEach(function (x) { if (x.cls && cl.indexOf(x.cls) < 0) cl.push(x.cls); });
    $('doCls').innerHTML = '<option value="">全部班級</option>' + cl.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
    $('doCls').classList.toggle('hidden', cl.length < 2);
    $('doTitle').textContent = b.vendor + (b.group ? '　送貨組別 ' + b.group : '');
    $('doSub').textContent = mdw(week.from) + '～' + mdw(week.to) + '・' + b.lines.length + ' 項・' + (b.perClass ? '照班級點' : '點品項總量') +
      (b.check ? '・上次驗收 ' + b.check.time + '（重新存會蓋掉）' : '');
    $('doNote').value = d ? d.note : b.check ? b.check.note : '';
    msg('doMsg', '', '');
    renderDo();
    renderThumbs();
    $('slipMsg').textContent = '選填。存起來的單價會進「單價表」，之後算成本用。';
    renderSlip();
    show('vDo');
  }
  function renderDo() {
    var b = cur.b, last = null, html = '', shown = visibleLines();
    shown.forEach(function (x) {
      if (b.perClass || x.cls) {
        var g = (x.date ? mdw(x.date) + '　' : '') + x.cls + (x.teacher ? '　' + x.teacher : '');
        if (g !== last) { html += '<div class="grp">' + esc(g) + '</div>'; last = g; }
      }
      var m = cur.marks[x.key] || {}, s = m.status || '';
      var cls = s === '到齊' ? ' ok' : s ? ' bad' : '';
      html += '<div class="item' + cls + '" data-k="' + esc(x.key) + '"><div><span class="nm">' + esc(x.name) + '</span>' +
        (x.note ? ' <span class="muted small">' + esc(x.note) + '</span>' : '') + (x.ovr ? ' <span class="badge none">' + esc(x.ovr) + '</span>' : '') + '</div>' +
        '<div class="ex">' + esc(x.expect) + '</div><div class="acts">' +
        ['到齊', '少送', '沒送', '送錯', '多送'].map(function (t) {
          return '<button type="button" class="st' + (s === t ? ' on' : '') + '" data-s="' + t + '">' + (t === '到齊' ? '✓ 到齊' : t) + '</button>';
        }).join('') +
        (s === '少送' || s === '多送' ? '<input class="got" type="text" placeholder="實到多少" value="' + esc(m.got || '') + '">' : '') +
        (s && s !== '到齊' ? '<input class="note" type="text" maxlength="100" placeholder="備註，例如：送成牛番茄" value="' + esc(m.note || '') + '">' : '') +
        '</div></div>';
    });
    $('doList').innerHTML = html || '<div class="muted" style="padding:16px 0">沒有符合的品項。</div>';
    var f = filtering();
    $('doCount').textContent = f ? '顯示 ' + shown.length + '／' + b.lines.length + ' 項' : '';
    $('allOk').textContent = f ? '✓ 這 ' + shown.length + ' 項都到齊' : '✓ 全部到齊';
    $('allOkHint').textContent = f ? '只會改目前搜尋到、還沒點的品項。' : '先按全部到齊，再改有問題的那幾項。';
    progress();
  }
  function filtering() { return !!($('doQ').value.trim() || $('doCls').value); }
  function visibleLines() {
    var q = $('doQ').value.trim().toLowerCase(), c = $('doCls').value;
    return cur.b.lines.filter(function (x) {
      if (c && x.cls !== c) return false;
      return !q || q.split(/\s+/).every(function (w) { return [x.name, x.cls, x.teacher, x.note].join(' ').toLowerCase().indexOf(w) >= 0; });
    });
  }
  $('doQ').addEventListener('input', function () { renderDo(); });
  $('doCls').addEventListener('change', function () { renderDo(); });

  // 點到一半自動暫存在這台平板（網路斷掉、關掉網頁也不會不見）；完成驗收後清掉
  function draftKey(b) { return 'rcvDraft:' + b.id; }
  function readDraft(b) {
    try {
      var d = JSON.parse(localStorage.getItem(draftKey(b)) || 'null');
      if (!d || !d.marks) return null;
      var keys = {};
      b.lines.forEach(function (x) { keys[x.key] = true; });
      Object.keys(d.marks).forEach(function (k) { if (!keys[k] || !d.marks[k].status) delete d.marks[k]; });
      if (!Object.keys(d.marks).length && !(d.photos || []).length && !d.note && !d.slip) return null;
      d.photos = d.photos || []; d.note = d.note || '';

  function shrink(file) {

        var w = Math.round(img.width * s), h = Math.round(img.height * s), rot = Number($('photoRot').value) || 0, side = rot === 90 || rot === 270;
        c.width = side ? h : w; c.height = side ? w : h;
        var g = c.getContext('2d');
        g.translate(c.width / 2, c.height / 2); g.rotate(rot * Math.PI / 180);
        g.drawImage(img, -w / 2, -h / 2, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.82).split(',')[1]);

      img.onerror = function () { reject(new Error('照片讀不到，請再拍一次。')); };

      '<textarea id="monNote" rows="2" style="width:100%;margin-top:8px" placeholder="備註，例如：差 50 元是 10/14 運費">' + esc(r.record ? r.record.note : '') + '</textarea>' +
      '<div class="row" style="margin-top:8px"><button type="button" class="btn" id="monSave">✓ 確認對帳</button>' +
      (r.record ? '<span class="muted small">上次對帳：' + esc(r.record.time) + '（發票 $' + money(r.record.invoice) + '）</span>' : '') + '</div></div>';
    $('monBox').innerHTML = html;
    mon.sum = sum;
    monDiff(); monThumbs();
  }
  function monDiff() {
    var v = numv($('monInv').value);
    $('monDiff').innerHTML = v === null ? '' : Math.abs(v - mon.sum) < 1 ? '<span class="badge ok">✓ 對得上</span>'
      : '<span class="badge bad">' + (v > mon.sum ? '發票多 $' : '發票少 $') + money(Math.abs(r2(v - mon.sum))) + '</span>';
  }
  function monThumbs() { $('monThumbs').innerHTML = monPhotos.map(function (u, i) { return ' <a href="' + esc(u) + '" target="_blank" class="small">📄 發票 ' + (i + 1) + '</a>'; }).join(''); }
  $('monGo').addEventListener('click', function () { loadMonth(); });
  $('monVendor').addEventListener('change', function () { loadMonth(); });
  $('monYm').addEventListener('change', function () { if ($('monVendor').value) loadMonth(); });
  $('monBox').addEventListener('input', function (e) { if (e.target.id === 'monInv') monDiff(); });
  $('monBox').addEventListener('change', function (e) {
    if (e.target.id !== 'monPhoto') return;
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length) return;
    $('monPhotoMsg').textContent = '上傳中…';
    files.reduce(function (p, f) {
      return p.then(function () { return shrink(f); }).then(function (b64) { return call('uploadPhoto', b64, 'image/jpeg', mon.ym + '-01', mon.vendor + ' 月結發票'); })
        .then(function (r) { monPhotos.push(r.url); monThumbs(); });
    }, Promise.resolve()).then(function () { $('monPhotoMsg').textContent = '已上傳，按「確認對帳」才會存在一起。'; })
      .catch(function (err) { $('monPhotoMsg').textContent = '上傳失敗：' + err.message; });
  });
  $('monBox').addEventListener('click', function (e) {
    if (e.target.id !== 'monSave') return;
    var b = e.target;
    b.disabled = true;
    call('saveMonth', { vendor: mon.vendor, ym: mon.ym, system: mon.sum, invoice: $('monInv').value, note: $('monNote').value, photos: monPhotos }).then(function () {
      var done = mon.vendor + ' ' + mon.ym + ' 對帳已存（試算表「月結對帳」分頁）。';
      loadMonth().then(function () { msg('monMsg', 'ok', done); });
    }).catch(function (err) { msg('monMsg', 'error', err.message); b.disabled = false; });
  });

  // ---------------- 問題追蹤 ----------------
  var issueAll = false, issues = null;
  function refreshIssueCount() {
    call('getIssues', false).then(function (r) { $('issueCount').textContent = r.list.length ? '（' + r.list.length + '）' : ''; }).catch(function () {});
  }
  document.querySelector('#vIssues .row').addEventListener('click', function (e) {
    var b = e.target.closest('[data-all]');
    if (!b) return;
    issueAll = b.getAttribute('data-all') === '1';
    Array.prototype.forEach.call(document.querySelectorAll('[data-all]'), function (x) { x.classList.toggle('on', x === b); });
    loadIssues();
  });
  function issueLine(x) {
    var what = x.status === '沒送' ? '沒送（應到 ' + x.expect + '）' : x.status === '送錯' ? '送錯（應到 ' + x.expect + '）' : x.status + '：應到 ' + x.expect + '，實到 ' + x.got;
    return (x.cls ? x.cls + ' ' : '') + x.name + '：' + what + (x.note ? '，' + x.note : '');
  }
  function loadIssues() {
    msg('issueMsg', 'info', '載入中…');
    $('issueList').innerHTML = '';
    call('getIssues', issueAll).then(function (r) {
      issues = r;
      $('issueCount').textContent = '';
      msg('issueMsg', r.list.length ? '' : 'ok', r.list.length ? '' : issueAll ? '最近 60 天沒有問題。' : '沒有還沒處理的問題 👍');
      var by = {}, order = [];
      r.list.forEach(function (x) { if (!by[x.id]) { by[x.id] = []; order.push(x.id); } by[x.id].push(x); });
      $('issueList').innerHTML = order.map(function (id) {
        var g = by[id], h = g[0];
        return '<div class="panel" data-id="' + esc(id) + '"><div class="row" style="justify-content:space-between"><div><b style="font-size:19px">' + esc(h.vendor) + '</b>' +
          (h.group ? ' <span class="muted">送貨組別 ' + esc(h.group) + '</span>' : '') + '<div class="muted small">' + esc(h.from ? md(h.from) + '～' + md(h.to) : '') + '・驗收 ' + esc(h.time) +
          (h.photos.length ? '・' + h.photos.map(function (u, i) { return '<a href="' + esc(u) + '" target="_blank">銷貨單' + (h.photos.length > 1 ? i + 1 : '') + '</a>'; }).join(' ') : '') + '</div></div>' +
          '<button type="button" class="btn ghost small" data-copy="' + esc(id) + '">📋 複製給廠商</button></div>' +
          '<table><tbody>' + g.map(function (x) {
            return '<tr><td>' + esc(issueLine(x)) + (x.doneTime ? '<div class="muted small">' + esc(x.state + '・' + x.doneTime + (x.doneNote ? '・' + x.doneNote : '')) + '</div>' : '') + '</td>' +
              '<td style="white-space:nowrap"><input type="text" data-note="' + x.row + '" placeholder="處理備註（選填）" style="width:150px" value="' + esc(x.doneNote) + '"> <select data-row="' + x.row + '">' + r.states.map(function (s) { return '<option' + (s === x.state ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></td></tr>';
          }).join('') + '</tbody></table></div>';
      }).join('');
    }).catch(function (e) { msg('issueMsg', 'error', '載入失敗：' + e.message); });
  }
  $('issueList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    var g = issues.list.filter(function (x) { return x.id === b.getAttribute('data-copy'); }), h = g[0];
    var text = h.vendor + ' 您好，三信家商餐飲科 ' + (h.from ? md(h.from) + '～' + md(h.to) : '') + ' 的貨：\n' +
      g.filter(function (x) { return x.state === '待處理'; }).map(function (x) { return '・' + issueLine(x); }).join('\n') + '\n麻煩補送或更正，謝謝！';
    copyText(text).then(function () { b.textContent = '已複製 ✓'; setTimeout(function () { b.textContent = '📋 複製給廠商'; }, 1500); })
      .catch(function () { msg('issueMsg', 'warn', '請長按選取複製：' + text); });
  });
  $('issueList').addEventListener('change', function (e) {
    var s = e.target.closest('select[data-row]');
    if (!s) return;
    var ni = document.querySelector('[data-note="' + s.getAttribute('data-row') + '"]'), note = ni ? ni.value.trim() : '';
    s.disabled = true;
    call('setIssues', [Number(s.getAttribute('data-row'))], s.value, note).then(function () { loadIssues(); refreshIssueCount(); })
      .catch(function (err) { msg('issueMsg', 'error', err.message); s.disabled = false; });
  });

  setWeek(0);
  refreshIssueCount();
})();
</script>
</body>
</html>
